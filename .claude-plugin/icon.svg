<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ClaudeWatch">
  <rect width="64" height="64" rx="14" fill="#282a36"/>
  <!-- The lookout posted on watch: an octagon — the shape that means stop before
       you go on — with an eye inside it. Red is the safety group's colour, shared
       with shipshape; the green pupil is the family's "resolved" mark. -->
  <g fill="none" stroke="#ff5555" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 32 10 L 47.6 16.4 L 54 32 L 47.6 47.6 L 32 54 L 16.4 47.6 L 10 32 L 16.4 16.4 Z"
          stroke-width="3"/>
    <path d="M 20.5 32 Q 32 23 43.5 32 Q 32 41 20.5 32 Z" stroke-width="2"/>
  </g>
  <circle cx="32" cy="32" r="3.6" fill="#50fa7b"/>
</svg>
