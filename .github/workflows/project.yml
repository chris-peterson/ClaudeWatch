name: Project

# Every generated artifact has one writer, and it is this job. shipyard's
# project action regenerates plugin.json, hooks.json, and plugin.yml's
# suite.describe block from their sources and commits the result to the
# branch, so a committed artifact matches its source at all times and the
# diff a reviewer approves is the change that lands.
#
# generate's build-docs pass fails if a docs/ link resolves to no published
# page — including docs/README.md's and docs/_sidebar.md's links to /rules
# and /prompts, which shipyard doesn't render. Rendering those two first puts
# them on disk (docs/ isn't committed either way) before that check runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The default pull_request checkout leaves a merge commit in
          # detached HEAD, and there is no branch there to push a projection to.
          ref: ${{ github.head_ref }}

      - name: Render the watches-derived docs pages build-docs can't produce
        run: python3 build/gen-rules-doc.py

      - uses: chris-peterson/shipyard/actions/project@v2
