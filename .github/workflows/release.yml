name: Release

# Requires repo secret MARKETPLACE_DISPATCH_TOKEN — a token allowed to
# repository_dispatch to chris-peterson/claude-marketplace (the default
# GITHUB_TOKEN cannot dispatch across repositories).

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - run: pip install pyyaml

      - name: Verify tag matches plugin.yml version
        run: |
          version=$(python3 -c "import yaml; print(yaml.safe_load(open('plugin.yml'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.yml version v$version" >&2
            exit 1
          fi

      - name: Verify plugin.json is in sync with plugin.yml
        run: python3 scripts/gen-plugin-json.py --check

      - name: Notify bridge.ai marketplace
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
        run: |
          gh api repos/chris-peterson/claude-marketplace/dispatches \
            -f event_type=plugin-released \
            -f 'client_payload[plugin]=ClaudeWatch' \
            -f "client_payload[tag]=${GITHUB_REF_NAME}"
