# Source of record for ClaudeWatch's hooks — shipyard generates hooks.json.
hooks:
  - event: PreToolUse
    matcher: Bash
    command: 'python3 ${CLAUDE_PLUGIN_ROOT}/scripts/watchdog.py ${CLAUDE_PLUGIN_ROOT}/watches'
    description: Screens the shell command against the watch rules before it runs.
  - event: PreToolUse
    matcher: Write|Edit
    command: 'python3 ${CLAUDE_PLUGIN_ROOT}/scripts/watchdog.py ${CLAUDE_PLUGIN_ROOT}/watches'
    description: Screens the code Claude writes to disk against the watch rules before it lands.
  - event: SessionStart
    command: 'bash ${CLAUDE_PLUGIN_ROOT}/hooks/cli-freshness.sh'
    description: No-op; ClaudeWatch ships no CLI.
  - event: SessionStart
    command: 'bash ${CLAUDE_PLUGIN_ROOT}/hooks/emit-rules.sh'
    description: Emit ClaudeWatch's ambient guidance into context.
  - event: SessionEnd
    command: 'python3 ${CLAUDE_PLUGIN_ROOT}/scripts/mute.py session-end'
    description: Clear this session's rule-set mutes when the session ends.
