# Source of record for ClaudeWatch's hooks — shipyard generates hooks.json.
hooks:
  - event: PreToolUse
    matcher: Bash|Monitor
    command: 'python3 "${CLAUDE_PLUGIN_ROOT}/scripts/watchdog.py" "${CLAUDE_PLUGIN_ROOT}/watches"'
    onFailure: block
    description: Screens the shell command against the watch rules before it runs. Monitor is included because it runs its command in the same shell as Bash.
  - event: PreToolUse
    matcher: Write|Edit
    command: 'python3 "${CLAUDE_PLUGIN_ROOT}/scripts/watchdog.py" "${CLAUDE_PLUGIN_ROOT}/watches"'
    onFailure: block
    description: Screens the code Claude writes to disk against the watch rules before it lands.
  - event: SessionStart
    command: 'bash "${CLAUDE_PLUGIN_ROOT}/hooks/emit-rules.sh"'
    description: Emit ClaudeWatch's ambient guidance into context.
  - event: SessionStart
    command: 'python3 "${CLAUDE_PLUGIN_ROOT}/scripts/overrides.py" session-start'
    description: Logs how the user's rule overrides differ from the shipped rules, and warns when the overrides file is broken or stale.
  - event: UserPromptSubmit
    command: 'python3 "${CLAUDE_PLUGIN_ROOT}/scripts/unattended.py"'
    description: Marks the session unattended on /ClaudeWatch:unattended, and clears the mark when the user types anything else.
  - event: PostToolUse
    matcher: Skill
    command: 'python3 "${CLAUDE_PLUGIN_ROOT}/scripts/unattended.py"'
    description: Marks the session unattended when the agent invokes the unattended skill.
  - event: PermissionRequest
    command: 'python3 "${CLAUDE_PLUGIN_ROOT}/scripts/unattended.py"'
    onFailure: block
    description: Denies a permission prompt while the session is unattended, so the call fails fast instead of waiting on nobody.
  - event: PreToolUse
    matcher: AskUserQuestion
    command: 'python3 "${CLAUDE_PLUGIN_ROOT}/scripts/unattended.py"'
    onFailure: block
    description: Denies a question to the user while the session is unattended, so the agent decides and keeps going.
