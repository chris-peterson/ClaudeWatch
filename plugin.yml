# Canonical descriptor for the ClaudeWatch plugin — edit here, never plugin.json.
# CI's project job (.github/workflows/project.yml) projects this into
# .claude-plugin/plugin.json and the marketplace SPA (the suite: block).
# Schema: suite/plugin.schema.md.

# Intentionally PascalCase, not the kebab-case convention: the name is
# load-bearing in the command namespace (/ClaudeWatch:rules, /ClaudeWatch:learn)
# and the pages URL, so renaming would break installed references. Accepted
# convention exception — not a finding to re-raise.
name: ClaudeWatch
version: 1.0.1
description: "Screens every shell command and every file Claude writes, before either lands. Blocks the dangerous, asks on anything that changes state."
author: chris-peterson
repository: https://github.com/chris-peterson/ClaudeWatch
icon: .claude-plugin/icon.svg
license: MIT
keywords: [claude, watch, safety, permissions, guardrail, hook, watchdog, installs, git-guardian]

validate:
  accept:
    - warning: root
      path: CLAUDE.md
      because: >-
        CLAUDE.md at the root is this repo's own agent instructions, not context
        the plugin ships. It imports AGENTS.md and adds the Claude Code
        specifics: the local test commands and the hook's stdin/stdout protocol.
    - warning: name
      path: .claude-plugin/plugin.json
      because: >-
        Renaming would break every installed copy. The name is the
        enabledPlugins key, the marketplace entry, and the cache path each
        session loads from. Claude Code accepts it as it stands; only the
        claude.ai marketplace sync requires kebab-case.

# → marketplace.json entry
marketplace:
  category: security
  homepage: https://chris-peterson.github.io/ClaudeWatch/#/

# → marketplace SPA; keys mirror the SPA's PLUGINS object.
suite:
  group: safety
  # Activated by the agent (the PreToolUse hook screens what the agent runs) and
  # the user (the /ClaudeWatch:learn and :rules skills).
  activations: [agent, user]
  gloss: "ClaudeWatch: agents move fast; watch them closely."
  pitch: "Stop allowing commands you haven't actually read. Save your attention for the decisions that matter."
  what: "Screens every shell command (and the code Claude writes to disk) before it runs, matching real patterns rather than naive prefixes, so reordered flags and chained commands don't slip past. Blocks the genuinely dangerous; asks before anything that changes state."
  cmds:
    - ["/ClaudeWatch:rules", "See the rules and change how they apply to you"]
    - ["/ClaudeWatch:learn", "Tune the rules from what's been prompting you"]
    - ["/ClaudeWatch:unattended", "Step away: the agent decides, logs, and never waits on a prompt"]
  # The automatic block/ask flow is the primary interaction (see session: below);
  # these examples are anchored on the two skills, for when you look under the hood.
  # >>> shipyard:describe — generated from source by `shipyard gen-describe`; do not edit >>>
  describe:
    skills:
      learn: Analyze the ClaudeWatch decision log to find the rules that ask most and the blocks that get in the way, and propose overrides (move a rule between ask and block, or turn it off) reviewed as one batch, then reset the log.
      rules: 'View ClaudeWatch''s rules and change how they apply to you: move a rule between block and ask, turn a rule or a whole rule set off, or restore the shipped tier, kept in an overrides file that survives plugin upgrades.'
      unattended: Work while the user is away, making best-judgment calls, logging them, and never waiting on a question, a permission prompt, or a ClaudeWatch ask.
    rules:
      ask-is-not-a-confirmation: Don't treat ClaudeWatch's ask tier as a confirmation
      avoid-compound-commands: Before you pipe or chain, check the lead command
    hooks:
      emit-rules: SessionStart — Emit ClaudeWatch's ambient guidance into context.
      hooks: 'Hook wiring: PreToolUse→watchdog (Bash|Monitor, Write|Edit), unattended (AskUserQuestion); SessionStart→emit-rules, overrides; UserPromptSubmit→unattended; PostToolUse→unattended (Skill); PermissionRequest→unattended.'
  # <<< shipyard:describe <<<
  examples:
    - label: "/ClaudeWatch:rules"
      ac: "--purple"
      frames:
        - { t: you, text: "/ClaudeWatch:rules" }
        - { t: claude, text: "watch-git blocks git push --force and asks before git push and git commit. Move one between block and ask, or turn it off?" }
        - { t: status, text: "previews the change, then writes it to your overrides file, which survives upgrades" }
    - label: "/ClaudeWatch:learn"
      ac: "--cyan"
      frames:
        - { t: you, text: "/ClaudeWatch:learn" }
        - { t: claude, text: "git stash asked 14 times this week and you approved every one. Turn that rule off?" }
        - { t: status, text: "proposes overrides from your decision log, applied once you approve each one" }
  session:
    - { t: claude, text: "Wrapping up — I'll force-push the rebase, then clear the scratch dirs." }
    - { t: watch, cmd: "git push --force", err: "watch-git — overwrites shared remote history", link: "https://git-scm.com/docs/git-push#Documentation/git-push.txt--f" }
    - { t: ask, cmd: "rm -rf .playwright-mcp", reason: "watch-files — recursively deletes directories", link: "https://man7.org/linux/man-pages/man1/rm.1.html" }

docs:
  code_languages: [bash, yaml, python]
  mermaid: false
  pre_render: python3 build/gen-rules-doc.py
