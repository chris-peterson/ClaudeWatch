name: watch-files
filter: '\b(rm|chmod|chown|mv|shred|dd|mkfs|diskutil)\b|/dev/'

rules:
  block:
    - name: rm -rf /
      pattern: '(?:^|[\s;&|`(]|(?:^|[\s;&|`(/])(?:ba|z|da|k)?sh\s+(?:[-+][oO]\s+\w+\s+|-\S+\s+)*-[a-zA-Z]*c[a-zA-Z]*\s+["\x27]|(?<![\w.-])eval\s+["\x27])rm(?=(?:\s+-\S+)*\s+(?:--r(?:e(?:c(?:u(?:r(?:s(?:i(?:ve?)?)?)?)?)?)?)?(?![\w-])|-[a-zA-Z]*[rR]))(?=(?:\s+-\S+)*\s+(?:--f(?:o(?:r(?:ce?)?)?)?(?![\w-])|-[a-zA-Z]*f))(?:\s+-\S+)*\s+/\*?(?![\w.~/*-])'
      reason: destroys the entire filesystem
      ref: https://man7.org/linux/man-pages/man1/rm.1.html

    - name: chmod 777
      pattern: 'chmod\s+(-R\s+)?777\b'
      reason: makes files world-readable/writable/executable
      ref: https://man7.org/linux/man-pages/man1/chmod.1.html

    - name: mv to /dev/null
      pattern: 'mv\s+.*\s+/dev/null'
      reason: destroys files by moving them to /dev/null
      ref: https://man7.org/linux/man-pages/man1/mv.1.html

    - name: shred
      pattern: 'shred\s+'
      reason: irrecoverably destroys file contents
      ref: https://man7.org/linux/man-pages/man1/shred.1.html

    - name: dd to raw device
      pattern: '(?:^|[\s;&|`(])dd\b[^\n;&|]*\bof\s*=\s*/dev/(?:sd|nvme|r?disk|hd|xvd|vd|mmcblk)'
      reason: writes raw bytes directly to a block device
      ref: https://man7.org/linux/man-pages/man1/dd.1.html

    - name: mkfs on device
      pattern: '(?:^|[\s;&|`(])mkfs(?:\.\w+)?\b[^\n;&|]*\s/dev/'
      reason: creates a new filesystem on a block device (wipes existing data)
      ref: https://man7.org/linux/man-pages/man8/mkfs.8.html

    - name: redirect to raw device
      pattern: '>\s*/dev/(?:sd|nvme|r?disk|hd|xvd|vd|mmcblk)'
      reason: overwrites a block device with the command's output
      ref: https://man7.org/linux/man-pages/man4/sd.4.html

    - name: diskutil erase
      pattern: '(?:^|[\s;&|`(])diskutil\s+(?:erase\w*|zeroDisk|randomDisk|secureErase|partitionDisk)\b'
      reason: erases or repartitions a disk
      ref: https://ss64.com/mac/diskutil.html

  ask:
    - name: rm -rf
      pattern: '(?:^|[\s;&|`(]|(?:^|[\s;&|`(/])(?:ba|z|da|k)?sh\s+(?:[-+][oO]\s+\w+\s+|-\S+\s+)*-[a-zA-Z]*c[a-zA-Z]*\s+["\x27]|(?<![\w.-])eval\s+["\x27])rm(?=(?:\s+-\S+)*\s+(?:--r(?:e(?:c(?:u(?:r(?:s(?:i(?:ve?)?)?)?)?)?)?)?(?![\w-])|-[a-zA-Z]*[rR]))(?=(?:\s+-\S+)*\s+(?:--f(?:o(?:r(?:ce?)?)?)?(?![\w-])|-[a-zA-Z]*f))'
      unless_condition: [is_in_tree_or_scratch]
      unless_regex: ['\bgit\b[^;&|]*\brm(?=$|[\s;&|)`<>])']
      reason: recursively deletes files and directories
      ref: https://man7.org/linux/man-pages/man1/rm.1.html

    - name: rm -r
      pattern: '(?:^|[\s;&|`(]|(?:^|[\s;&|`(/])(?:ba|z|da|k)?sh\s+(?:[-+][oO]\s+\w+\s+|-\S+\s+)*-[a-zA-Z]*c[a-zA-Z]*\s+["\x27]|(?<![\w.-])eval\s+["\x27])rm(?=(?:\s+-\S+)*\s+(?:--r(?:e(?:c(?:u(?:r(?:s(?:i(?:ve?)?)?)?)?)?)?)?(?![\w-])|-[a-zA-Z]*[rR]))'
      unless_condition: [is_in_tree_or_scratch]
      unless_regex: ['\bgit\b[^;&|]*\brm(?=$|[\s;&|)`<>])']
      reason: recursively deletes directories
      ref: https://man7.org/linux/man-pages/man1/rm.1.html

    - name: mv /
      pattern: '(?:^|[\s;&|`(])mv(?:\s+-\S+)*\s+/(?:\*?(?=$|[\s;&|)`<>])|(?:private/)?(?:etc|var(?!/(?:tmp|folders)(?=/|$|[\s;&|)`<>])))(?=/|$|[\s;&|)`<>])|(?:usr|bin|sbin|lib|lib64|opt|boot|dev|proc|sys|root|System|Library|Applications)(?=/|$|[\s;&|)`<>]))'
      reason: moves files from root-level paths
      ref: https://man7.org/linux/man-pages/man1/mv.1.html

    - name: chmod
      pattern: 'chmod\s+'
      reason: changes file permissions
      ref: https://man7.org/linux/man-pages/man1/chmod.1.html

    - name: chown
      pattern: 'chown\s+'
      reason: changes file ownership
      ref: https://man7.org/linux/man-pages/man1/chown.1.html
