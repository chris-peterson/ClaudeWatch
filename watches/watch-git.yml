name: watch-git
filter: '\bgit\b'

rules:
  block:
    - name: git push --force
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+push\s.*(--force(?!-)|(?<=\s)-[a-zA-Z]*f\b)'
      reason: overwrites shared remote history
      ref: https://git-scm.com/docs/git-push#Documentation/git-push.txt--f

    - name: git checkout .
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+checkout\s+\.(?=$|[\s;&|)`<>])'
      reason: discards all working tree changes with no recovery
      ref: https://git-scm.com/docs/git-checkout

    - name: git restore .
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+restore\s+\.(?=$|[\s;&|)`<>])'
      reason: discards all unstaged changes with no recovery
      ref: https://git-scm.com/docs/git-restore

    - name: git clean -f
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+clean\s.*(?<=\s)(?:-[a-zA-Z]*f|--f(?:o(?:r(?:ce?)?)?)?(?![\w-]))'
      reason: deletes untracked files with no recovery
      ref: https://git-scm.com/docs/git-clean#Documentation/git-clean.txt--f

    - name: git stash drop/clear
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+stash\s+(drop|clear)'
      reason: discards stashed changes with no recovery
      ref: https://git-scm.com/docs/git-stash#Documentation/git-stash.txt-drop

    - name: git reflog expire/delete
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+reflog\s+(expire|delete)'
      reason: destroys the local recovery log
      ref: https://git-scm.com/docs/git-reflog#Documentation/git-reflog.txt-expire

    - name: git gc --prune=now / git prune
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+(?:gc\s.*(?<=\s)--p(?:r(?:u(?:ne?)?)?)?(?:=|\s+)(?:now|all)\b|prune(?![\w-])(?!.*(?<=\s)(?:-n|--dry-run)\b))'
      reason: permanently deletes unreachable objects, ending recovery of dropped stashes and lost commits through git fsck
      ref: https://git-scm.com/docs/git-prune

    - name: git filter-branch/filter-repo
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+filter-(?:branch|repo)(?![\w-])(?![^\n;&|]*(?<=\s)(?:--help|--version|--dry-run|--analyze)(?![\w-]))'
      reason: rewrites every commit in the repository's history (filter-repo also expires the reflog)
      ref: https://git-scm.com/docs/git-filter-branch

  ask:
    - name: git checkout -- <file>
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+checkout\s+--\s'
      reason: discards working tree changes to specified files with no recovery
      ref: https://git-scm.com/docs/git-checkout

    - name: git reset --hard
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+reset\s.*(?<=\s)--h(?:a(?:rd?)?)?(?![\w-])'
      reason: discards uncommitted changes with no recovery
      ref: https://git-scm.com/docs/git-reset#Documentation/git-reset.txt---hard

    - name: git commit
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+commit(?=$|[\s;&|)`<>])'
      reason: creates a permanent commit
      ref: https://git-scm.com/docs/git-commit

    - name: git stash
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+stash(?!\s+(?:list|show)(?=$|[\s;&|)`<>]))(?=$|[\s;&|)`<>])'
      reason: modifies the stash stack
      ref: https://git-scm.com/docs/git-stash

    - name: git push --force-with-lease
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+push\s.*--force-with-lease'
      reason: rewrites remote history with stale-ref protection
      ref: https://git-scm.com/docs/git-push#Documentation/git-push.txt---no-force-with-lease

    - name: git push --delete
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+push\s.*(--de(?:l(?:e(?:te?)?)?)?(?![\w-])|(?<=\s)-d\b|(?<=\s):\S)'
      reason: deletes the remote branch — the remote keeps no reflog, so recovery needs a local copy of the commits
      ref: https://git-scm.com/docs/git-push#Documentation/git-push.txt---delete

    - name: git push
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+push(?!\s.*(?:--force-with-lease|--de(?:l(?:e(?:te?)?)?)?(?![\w-])|(?<=\s)-d\b|(?<=\s):\S))(?=$|[\s;&|)`<>])'
      reason: publishes commits to the shared remote
      ref: https://git-scm.com/docs/git-push

    - name: git branch -D
      pattern: 'git(?:\s+-\S+(?:\s+(?:"[^"]*"|''[^'']*''|[^-\s]\S*))?)*\s+branch\s(?:.*(?<=\s)-[a-zA-Z]*D|(?=.*(?<=\s)(?:-[a-zA-Z]*d[a-zA-Z]*|--d(?:e(?:l(?:e(?:te?)?)?)?)?)(?![\w-]))(?=.*(?<=\s)(?:-[a-zA-Z]*f[a-zA-Z]*|--forc(?:e)?)(?![\w-])))'
      reason: force-deletes a branch regardless of merge status (recoverable via reflog)
      ref: https://git-scm.com/docs/git-branch#Documentation/git-branch.txt--D
