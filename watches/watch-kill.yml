name: watch-kill
filter: '\b(pkill|killall)\b'

rules:
  ask:
    - name: pkill
      pattern: '(?:(?:^|[;&|`(\n])\s*(?:(?:sudo|nohup|exec|xargs|command|env|nice)(?:\s+-\S+)*\s+|timeout(?:\s+-\S+)*\s+\S+\s+|[A-Za-z_]\w*=\S*\s+)*|(?:^|[\s;&|`(/])(?:ba|z|da|k)?sh\s+(?:[-+][oO]\s+\w+\s+|-\S+\s+)*-[a-zA-Z]*c[a-zA-Z]*\s+["\x27]|(?<![\w.-])eval\s+["\x27])(?:\S*/)?pkill(?=$|[\s;&|)`<>])'
      reason: kills every process whose name matches a pattern
      ref: https://man7.org/linux/man-pages/man1/pkill.1.html

    - name: killall
      pattern: '(?:(?:^|[;&|`(\n])\s*(?:(?:sudo|nohup|exec|xargs|command|env|nice)(?:\s+-\S+)*\s+|timeout(?:\s+-\S+)*\s+\S+\s+|[A-Za-z_]\w*=\S*\s+)*|(?:^|[\s;&|`(/])(?:ba|z|da|k)?sh\s+(?:[-+][oO]\s+\w+\s+|-\S+\s+)*-[a-zA-Z]*c[a-zA-Z]*\s+["\x27]|(?<![\w.-])eval\s+["\x27])(?:\S*/)?killall(?=$|[\s;&|)`<>])'
      reason: kills every process with a given name
      ref: https://man7.org/linux/man-pages/man1/killall.1.html
