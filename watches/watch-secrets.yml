name: watch-secrets
filter: '\b(?:cat|tac|bat|nl|od|xxd|strings|rev|egrep|fgrep|less|more|head|tail)\b|\b(?:echo|printf|export|env|printenv)\b|<'

rules:
  block:
    - name: read SSH private keys
      pattern: '(?:(?<![\w-])(?:cat|tac|bat|nl|od|xxd|strings|rev|egrep|fgrep|less|more|head|tail)\s+.*|(?<!<)<(?![<(&])\s*\S*)(/\.ssh/id_|~\/\.ssh/id_)'
      reason: exposes SSH private keys
      ref: https://man.openbsd.org/ssh.1

    - name: read cloud credentials
      pattern: '(?:(?<![\w-])(?:cat|tac|bat|nl|od|xxd|strings|rev|egrep|fgrep|less|more|head|tail)\s+.*|(?<!<)<(?![<(&])\s*\S*)(\.aws/credentials|\.aws/(?:sso|cli)/cache\b|\.gcp/|\.azure/|\.config/gcloud)'
      reason: exposes cloud provider credentials
      ref: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html

    - name: echo secret env var
      pattern: '(?i)(echo|printf)\s+.*\$\{?\w*(SECRET|TOKEN|PASSWORD|API.?KEY|PRIVATE.?KEY)'
      reason: prints a secret-named environment variable, exposing its value
      ref: https://cwe.mitre.org/data/definitions/532.html

  ask:
    - name: read files with secret-like names
      pattern: '(?i)(?:(?<![\w-])(?:cat|tac|bat|nl|od|xxd|strings|rev|egrep|fgrep|less|more|head|tail)\s+|(?<!<)<(?![<(&])\s*)(?=\S*[/~.])\S*(secret|token|password|credential|api.?key|private.?key)'
      reason: filename suggests it may contain secrets
      ref: https://cwe.mitre.org/data/definitions/532.html

    - name: export secrets inline
      pattern: '(?i)export\s+\w*(SECRET|TOKEN|PASSWORD|API.?KEY|PRIVATE.?KEY|DATABASE_URL)\w*='
      reason: hardcodes secrets in shell environment
      ref: https://cwe.mitre.org/data/definitions/798.html

    - name: read .env files
      pattern: '(?:(?<![\w-])(?:cat|tac|bat|nl|od|xxd|strings|rev|egrep|fgrep|less|more|head|tail)\s+.*|(?<!<)<(?![<(&])\s*\S*)\.env\b'
      reason: environment files often contain secrets
      ref: https://12factor.net/config

    - name: read PEM/key files
      pattern: '(?:(?<![\w-])(?:cat|tac|bat|nl|od|xxd|strings|rev|egrep|fgrep|less|more|head|tail)\s+.*|(?<!<)<(?![<(&])\s*\S*)(\.pem|\.key|\.crt|\.cert)\b'
      reason: may expose private keys or certificates
      ref: https://man.openbsd.org/openssl.1

    - name: env / printenv
      pattern: '(?:^|[\s;&|`(])(env|printenv)(?:$|[\s;&|`)])'
      reason: dumps all environment variables which may include secrets
      ref: https://man7.org/linux/man-pages/man1/env.1.html

    - name: read dotfiles
      pattern: '(?:(?<![\w-])(?:cat|tac|bat|nl|od|xxd|strings|rev|egrep|fgrep|less|more|head|tail)\s+.*|(?<!<)<(?![<(&])\s*\S*)~/?\.'
      except: '(?s)^(?!.*(?:\.\.|[$`]))(?!.*~/?\.(?!claude/(?:skills/[^/\s]+|plugins)/cache/))'
      reason: may expose sensitive configuration
      ref: https://wiki.archlinux.org/title/Dotfiles
