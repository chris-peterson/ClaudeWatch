name: watch-su
filter: '\bsu(do)?\b'

rules:
  block:
    - name: sudo
      pattern: '(?:(?:^|[;&|`(\n])\s*(?:(?:nohup|exec|xargs|command|env|nice)(?:\s+-\S+)*\s+|timeout(?:\s+-\S+)*\s+\S+\s+|[A-Za-z_]\w*=\S*\s+)*|(?:^|[\s;&|`(/])(?:ba|z|da|k)?sh\s+(?:[-+][oO]\s+\w+\s+|-\S+\s+)*-[a-zA-Z]*c[a-zA-Z]*\s+["\x27]|(?<![\w.-])eval\s+["\x27])(?:\S*/)?sudo(?=$|[\s;&|)`<>])'
      reason: runs a command as root; with a cached sudo timestamp or a NOPASSWD entry it runs with no prompt at all
      ref: https://man7.org/linux/man-pages/man8/sudo.8.html

    - name: su
      pattern: '(?:(?:^|[;&|`(\n])\s*(?:(?:sudo|nohup|exec|xargs|command|env|nice)(?:\s+-\S+)*\s+|timeout(?:\s+-\S+)*\s+\S+\s+|[A-Za-z_]\w*=\S*\s+)*|(?:^|[\s;&|`(/])(?:ba|z|da|k)?sh\s+(?:[-+][oO]\s+\w+\s+|-\S+\s+)*-[a-zA-Z]*c[a-zA-Z]*\s+["\x27]|(?<![\w.-])eval\s+["\x27])(?:\S*/)?su(?=$|[\s;&|)`<>])'
      reason: switches to another user, root by default
      ref: https://man7.org/linux/man-pages/man1/su.1.html
